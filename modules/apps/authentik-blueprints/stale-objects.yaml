---
# Graveyard: authentik objects left behind by apps that no longer exist
# in this flake.
#
# Removing an app module stops rendering its blueprint, but blueprint
# applies are upserts — they never delete. Every app that has ever been
# retired or renamed therefore left its provider, application and policy
# binding sitting in authentik's database, invisible to the flake and
# un-managed by anything.
#
# Mostly that is harmless clutter (a dead tile on the user's
# applications page). It stops being harmless the moment a name gets
# reclaimed: a leftover ProxyProvider is an OAuth2Provider subclass under
# Django multi-table inheritance, so a new OIDC provider blueprint with
# the same `name:` merges into the corpse instead of creating a clean
# object, and authentik's proxy save logic then rewrites redirect_uris to
# the outpost callbacks on every save. That is exactly how shelfmark's
# first login failed with "missing, invalid, or mismatching redirection
# URI" — see the migration-cleanup stanza at the top of
# shelfmark-blueprints/shelfmark.yaml, and manyfold's in PR #428.
#
# Everything listed here must be dead on BOTH servers — absent from
# `myCaddy.apps`, `myAuthentik.forwardAuthApps` and `myAuthentik.oidcApps`
# on hpp-1 and amos1 alike. That matters because this blueprint applies
# everywhere: a name that is retired on one host but live on the other
# must NOT be listed, or the deletion would break the host where it still
# runs. One name is in that (excluded) state today — omada is prod-only
# and so orphaned on hpp-1, where the dev authentik still holds its proxy
# provider and application tile. That orphan is the tolerable half of the
# tradeoff described above: it only becomes a hazard if the same name is
# later reclaimed by an *OIDC* provider on that host, and a forward-auth
# app coming back re-upserts the object it left.
#
# The usual discipline is to verify a name dead on both hosts *before*
# adding it here. kapowarr, readeck and ytdlp-web-player (dev-only
# forward-auth apps, #700) are the sanctioned exception: their objects
# are added in the very same change that removes their modules, so the
# forward-auth creation blueprint leaves `blueprints_dir` in the same
# closure that ships these `absent` entries — nothing can re-upsert them.
# kapowarr and ytdlp-web-player only ever ran on dev (hpp-1), so `absent`
# is a live delete there and a no-op on amos1. readeck additionally has an
# old orphan on amos1 from when it was a common app, which could not be
# reaped while it still ran on hpp-1; this change clears it too.
#
# `state: absent` is idempotent — once an object is gone the identifier
# matches nothing and the entry is a no-op — so entries can stay
# indefinitely. Add to this file when retiring an app rather than
# leaving the objects behind.
#
#   kapowarr     retired dev-only comics manager (#700)
#   maintainerr  retired *arr-adjacent media-request janitor
#   metube       retired yt-dlp frontend, replaced by pinchflat
#   readeck      retired dev-only read-it-later / bookmark archive (#700)
#   mylar3       renamed: the live forward-auth app is now `mylar`
#   prometheus   retired, replaced by victoriametrics + vmalert
#   watchstate   retired play-state sync
#   ytdlp-web-player  retired dev-only yt-dlp streaming player (#700)
#   shelfarr     retired book request system, replaced by shelfmark (manual
#                search) + bindery (monitoring). Unlike the others this one
#                spoke OIDC directly, so it leaves an oauth2provider rather
#                than a proxyprovider.
version: 1
metadata:
  name: stale-objects
entries:
  # Applications first, so the dead tile disappears even if a provider
  # delete were ever to fail. Application.provider is on_delete=SET_NULL
  # and policy bindings cascade off the application, so removing the pair
  # takes the binding with it.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: maintainerr
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: maintainerr

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: metube
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: metube

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: mylar3
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: mylar3

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: prometheus
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: prometheus

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: watchstate
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: watchstate

  # shelfarr authenticated via myAuthentik.oidcApps, so its leftover is a plain
  # OAuth2Provider — no MTI subclass to trip over, but the application tile and
  # the client credentials should still go rather than sit in the IdP forever.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: shelfarr
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: shelfarr

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: unifi
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: unifi

  # kapowarr, readeck and ytdlp-web-player — dev-only forward-auth apps
  # removed in #700. All three left ProxyProviders (forward_single).
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: kapowarr
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: kapowarr

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: readeck
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: readeck

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: ytdlp-web-player
  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: ytdlp-web-player

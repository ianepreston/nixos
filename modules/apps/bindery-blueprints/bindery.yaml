version: 1
metadata:
  name: bindery
entries:
  # Bindery reads the user's groups from the ID token (falling back to the
  # userinfo document) to drive BINDERY_OIDC_ADMIN_GROUP. authentik's stock
  # `profile` mapping already emits the claim, but the provider's scope list is
  # typed into bindery's UI by hand — registering `groups` as a real scope means
  # `openid email profile groups` works there as written, instead of depending
  # on the operator knowing the claim rides along inside `profile`.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-bindery-groups
    identifiers:
      name: "Bindery groups"
    attrs:
      scope_name: groups
      description: "Group membership claim consumed by Bindery's admin-group mapping"
      expression: |
        return {
            "groups": [group.name for group in request.user.ak_groups.all()],
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: prov-bindery
    identifiers:
      name: bindery
    attrs:
      client_type: confidential
      client_id: !Env BINDERY_OIDC_CLIENT_ID
      client_secret: !Env BINDERY_OIDC_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !KeyOf scope-bindery-groups
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # authentik 2026.x added OAuth2Provider.grant_types (default empty); the
      # authorize view rejects flows whose grant is not listed. Required so a
      # provider created fresh on 2026.x is usable (see komga.yaml for detail).
      grant_types:
        - authorization_code
        - refresh_token
      # Bindery builds its callback as <base>/api/v1/auth/oidc/<provider-id>/
      # callback, where <provider-id> is the short id given to the provider in
      # its own UI. `authentik` is that id — it has to match exactly, so keep
      # the two in step if the provider is ever recreated.
      redirect_uris:
        - matching_mode: strict
          url: https://bindery.@serverDomain@/api/v1/auth/oidc/authentik/callback
      access_code_validity: minutes=1
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app-bindery
    identifiers:
      slug: bindery
    attrs:
      name: Bindery
      provider: !KeyOf prov-bindery
      group: Infrastructure
      open_in_new_tab: true
      meta_launch_url: https://bindery.@serverDomain@
      # No upstream icon in dashboard-icons yet; fall back to the repo favicon
      # (same pattern as kapowarr). Swap to the dashboard-icons slug if one lands.
      meta_icon: https://raw.githubusercontent.com/vavallee/bindery/main/web/public/favicon.png
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-bindery
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, Infrastructure]]
      enabled: true

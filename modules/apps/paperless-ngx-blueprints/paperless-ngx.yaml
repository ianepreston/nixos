version: 1
metadata:
  name: paperless-ngx
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: prov-paperless-ngx
    identifiers:
      name: paperless-ngx
    attrs:
      # Public, not confidential: Swift Paperless (iOS) takes this provider's
      # client_id from paperless's headless config and redeems the code at the
      # token endpoint itself, with S256 PKCE and no client_secret. authentik
      # enforces the secret only for confidential clients
      # (providers/oauth2/token/base.py), so confidential fails it with
      # invalid_client. The web UI (allauth) still sends the secret below,
      # which a public provider ignores, and also uses PKCE
      # (OAUTH_PKCE_ENABLED), so both real clients stay PKCE-bound (#948).
      client_type: public
      client_id: !Env PAPERLESS_NGX_OIDC_CLIENT_ID
      client_secret: !Env PAPERLESS_NGX_OIDC_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # authentik 2026.x added OAuth2Provider.grant_types (default empty); the
      # authorize view rejects flows whose grant is not listed. Required so a
      # provider created fresh on 2026.x is usable (see komga.yaml for detail).
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://paperless-ngx.@serverDomain@/accounts/oidc/authentik/login/callback/
        # Swift Paperless (iOS) callback, handed to the IdP via
        # ASWebAuthenticationSession. Fixed in the app binary, so it is the
        # same on every host and takes no per-host domain placeholder —
        # deliberately not spelled here, because renderedBlueprintDir
        # substitutes that literal in comments too. Strict, not regex: it is a
        # fixed literal. authentik also checks it at the token endpoint, so
        # this one entry covers both steps (#948).
        - matching_mode: strict
          url: x-paperless://oidc-callback
      access_code_validity: minutes=1
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app-paperless-ngx
    identifiers:
      slug: paperless-ngx
    attrs:
      name: Paperless-ngx
      provider: !KeyOf prov-paperless-ngx
      group: Home
      open_in_new_tab: true
      meta_launch_url: https://paperless-ngx.@serverDomain@
      meta_icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/paperless-ngx.png
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-paperless-ngx
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, Home]]
      enabled: true

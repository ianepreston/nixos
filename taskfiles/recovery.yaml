---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Recovery tasks — per-app and whole-host restore from restic.
#
# ## Usage
#
#   task recovery:app APP=<app>         # in-place restore on HOST
#       HOST=hpp-1
#       [DEST=<ip-or-host>]              # default: same as HOST
#       [SOURCE_HOST=<other-host>]       # default: same as HOST
#       [MANIFEST_HOST=<flake-host>]     # default: HOST
#
# Set MANIFEST_HOST when HOST/DEST is an IP address or another non-flake
# target name; it selects the configuration whose enabled app metadata is used.
#
# `recovery:app` restores one app in one of three shapes (volume,
# postgres, sqlite) and then runs its HTTP health check where it has one.
# `recovery:all` runs every enabled app through it in manifest order — use
# it for catastrophic rebuilds.
#
# App modules own recovery metadata. The generated manifest drives both
# `recovery:app` and `recovery:all`; the reusable restore mechanics live in
# scripts/recovery.sh and scripts/_recovery/remote.sh, and this file only
# keeps the Task entry points and the drill.
#
# ## Verification drill (recovery:test:full)
#
# Spins up a tests-server quickemu VM, reinstalls it from this flake,
# restores bookorbit + miniflux + jellyfin + paperless-ngx from
# SOURCE_HOST's restic repo (exercising the three app shapes, plus the
# document archive as the one restore that can't be rebuilt from
# anywhere else), and tears the VM down. Quarterly
# cadence — see issue #135 for the rationale.
#
#   task recovery:test:full                     # SOURCE_HOST=hpp-1
#   task recovery:test:full SOURCE_HOST=amos1   # prod data, via /mnt/prod-backups
version: '3'
set: [pipefail]
shopt: [globstar]
tasks:
  # ---------------------------------------------------------------------------
  # Restore mechanics: scripts/recovery.sh
  # ---------------------------------------------------------------------------
  #
  # The restore programs live in tracked, linted source files (#1025):
  # scripts/recovery.sh is the operator-side driver (bash + jq: manifest
  # loading, validation, dispatch, ordering) and scripts/_recovery/remote.sh
  # the target side (bash only — the servers ship no python3 or jq), sent
  # base64-encoded in the ssh command under `ssh -n` and confirmed by a per-run
  # completion marker, so neither ssh_config's StdinNull nor the caller's stdin
  # can change what runs. That pair owns the stop/restore/start sequence,
  # `restic unlock` + `--retry-lock 10m` (#676), `--delete` (#217), the
  # pg_dumpall replay, the SQLite swaps and the health probe; read the
  # comments there. The tasks below are thin entry points with unchanged
  # names and variables. Every variable is passed with `shellQuote`, and an
  # empty one means the driver's default (DEST and SOURCE_HOST: HOST,
  # SSH_PORT: 22, TARGET_USER: ipreston, REPO_MOUNT: /mnt/backups;
  # /mnt/<otherEnv>-backups for a cross-environment restore).
  #
  # Manifest values travel as structured JSON from `nix eval` to the driver,
  # which validates each entry and hands the target jq `@sh`-quoted bash
  # arrays — never space-joined lists or colon-delimited triples. The restic
  # password is read on the target from /run/secrets/restic/password.
  #
  # Shutdown is a hard boundary (#1017): every requested unit must stop
  # successfully and report inactive before any restore work, and a failed
  # stop or restore never restarts anything.
  #
  # Hidden historical templates. Carrying no `desc:` keeps them out of `task
  # --list`; they keep their old space-joined UNITS/PATHS and `src:dst:owner`
  # SWAPS variables (the driver converts them to a one-entry manifest) so a
  # hand-run or documented invocation keeps working. They deliberately do not
  # set `internal: true`, which would make a CLI call exit 202.
  _restore-volume:
    requires:
      vars: [HOST, APP, UNITS, PATHS]
    cmds:
      - |
        "{{.TASKFILE_DIR}}/../scripts/recovery.sh" template volume \
          --app {{.APP | shellQuote}} \
          --units {{.UNITS | shellQuote}} \
          --paths {{.PATHS | shellQuote}} \
          --host {{.HOST | shellQuote}} \
          --dest {{.DEST | default "" | shellQuote}} \
          --source-host {{.SOURCE_HOST | default "" | shellQuote}} \
          --ssh-port {{.SSH_PORT | default "" | shellQuote}} \
          --target-user {{.TARGET_USER | default "" | shellQuote}} \
          --repo-mount {{.REPO_MOUNT | default "" | shellQuote}}
  _restore-pg:
    requires:
      vars: [HOST, APP, UNITS, DB]
    cmds:
      # PATHS: extra non-postgres paths restored alongside
      # /var/backup/postgresql (on-disk state of native or containerized apps).
      - |
        "{{.TASKFILE_DIR}}/../scripts/recovery.sh" template pg \
          --app {{.APP | shellQuote}} \
          --units {{.UNITS | shellQuote}} \
          --paths {{.PATHS | default "" | shellQuote}} \
          --db {{.DB | shellQuote}} \
          --host {{.HOST | shellQuote}} \
          --dest {{.DEST | default "" | shellQuote}} \
          --source-host {{.SOURCE_HOST | default "" | shellQuote}} \
          --ssh-port {{.SSH_PORT | default "" | shellQuote}} \
          --target-user {{.TARGET_USER | default "" | shellQuote}} \
          --repo-mount {{.REPO_MOUNT | default "" | shellQuote}}
  _restore-sqlite:
    requires:
      vars: [HOST, APP, UNITS, PATHS, SWAPS]
    cmds:
      # SWAPS: space-separated "staged:live:owner" triples; `@env@` in owner
      # becomes server-<env> as detected on the target.
      - |
        "{{.TASKFILE_DIR}}/../scripts/recovery.sh" template sqlite \
          --app {{.APP | shellQuote}} \
          --units {{.UNITS | shellQuote}} \
          --paths {{.PATHS | shellQuote}} \
          --swaps {{.SWAPS | shellQuote}} \
          --host {{.HOST | shellQuote}} \
          --dest {{.DEST | default "" | shellQuote}} \
          --source-host {{.SOURCE_HOST | default "" | shellQuote}} \
          --ssh-port {{.SSH_PORT | default "" | shellQuote}} \
          --target-user {{.TARGET_USER | default "" | shellQuote}} \
          --repo-mount {{.REPO_MOUNT | default "" | shellQuote}}
  _health:
    requires:
      vars: [HOST, APP, URL]
    cmds:
      - |
        "{{.TASKFILE_DIR}}/../scripts/recovery.sh" template health \
          --app {{.APP | shellQuote}} \
          --url {{.URL | shellQuote}} \
          --expect {{.EXPECT | default "" | shellQuote}} \
          --retries {{.RETRIES | default "" | shellQuote}} \
          --sleep {{.SLEEP | default "" | shellQuote}} \
          --host {{.HOST | shellQuote}} \
          --dest {{.DEST | default "" | shellQuote}} \
          --ssh-port {{.SSH_PORT | default "" | shellQuote}} \
          --target-user {{.TARGET_USER | default "" | shellQuote}}
  # ---------------------------------------------------------------------------
  # Manifest-driven dispatch
  # ---------------------------------------------------------------------------
  # App modules expose the facts each restore shape needs through
  # `myRecovery.manifest`. There is deliberately no per-app Task registry:
  # invoke one app with `task recovery:app APP=<name> HOST=<host>`.
  # MANIFEST_FILE (used by `all`) skips the per-app `nix eval`.
  app:
    desc: Restore APP on HOST using the Nix-generated recovery manifest
    requires: {vars: [HOST, APP]}
    vars:
      MANIFEST_HOST: "{{.MANIFEST_HOST | default .HOST}}"
    cmds:
      - |
        "{{.TASKFILE_DIR}}/../scripts/recovery.sh" app \
          --app {{.APP | shellQuote}} \
          --manifest-file {{.MANIFEST_FILE | default "" | shellQuote}} \
          --manifest-host {{.MANIFEST_HOST | shellQuote}} \
          --host {{.HOST | shellQuote}} \
          --dest {{.DEST | default "" | shellQuote}} \
          --source-host {{.SOURCE_HOST | default "" | shellQuote}} \
          --ssh-port {{.SSH_PORT | default "" | shellQuote}} \
          --target-user {{.TARGET_USER | default "" | shellQuote}} \
          --repo-mount {{.REPO_MOUNT | default "" | shellQuote}}
  # ---------------------------------------------------------------------------
  # Catastrophic restore - every enabled app on this flake host
  # ---------------------------------------------------------------------------
  # `order` is declared beside each app and preserves the prior sequence:
  # authentik first, followed by the independent apps in their existing order.
  # The driver evaluates the manifest once, validates every entry, then
  # restores each app in order and stops at the first failure (status 201,
  # as when it ran a nested `task recovery:app`). Every ssh runs with -n and
  # every app with stdin from /dev/null, so a probe cannot drain the remaining
  # app list — the failure mode that once ended the chain early with exit 0.
  all:
    desc: Catastrophic restore - every enabled app on HOST from SOURCE_HOST (default same host)
    requires: {vars: [HOST]}
    vars:
      MANIFEST_HOST: "{{.MANIFEST_HOST | default .HOST}}"
    cmds:
      - |
        "{{.TASKFILE_DIR}}/../scripts/recovery.sh" all \
          --manifest-host {{.MANIFEST_HOST | shellQuote}} \
          --host {{.HOST | shellQuote}} \
          --dest {{.DEST | default "" | shellQuote}} \
          --source-host {{.SOURCE_HOST | default "" | shellQuote}} \
          --ssh-port {{.SSH_PORT | default "" | shellQuote}} \
          --target-user {{.TARGET_USER | default "" | shellQuote}} \
          --repo-mount {{.REPO_MOUNT | default "" | shellQuote}}
  # ---------------------------------------------------------------------------
  # End-to-end drill: VM up → install → restore four apps → teardown
  # ---------------------------------------------------------------------------
  # Confirms last night's restic snapshot is actually replayable into a
  # working app for each of the three app shapes (containerized + pg,
  # native + pg only, native + sqlite-quiesce). paperless-ngx is a
  # fourth: native + pg with on-disk documents, several consumer units
  # and a backup-excluded subtree, and the one dataset that can't be
  # rebuilt from anywhere else (#944). Quarterly. See issue #135 for
  # the rationale.
  #
  # VM lifecycle (up/install/down/sops-authorize) lives under `task vm:*`
  # in taskfiles/vm.yaml — generic enough to also drive tests-desktop
  # iteration and not tied to the restore drill.
  test:full:
    desc: Quarterly end-to-end drill — VM up, reinstall, restore bookorbit/miniflux/jellyfin/paperless-ngx from SOURCE_HOST, teardown
    vars:
      SOURCE_HOST: '{{.SOURCE_HOST | default "hpp-1"}}'
      SSH_PORT: '{{.SSH_PORT | default "22322"}}'
      # The VM decrypts its own hostSpec's sopsFile (hpp-1.yaml) whatever
      # SOURCE_HOST is, so that is the file to authorize, not SOURCE_HOST's.
      VM_SOPS_TARGET:
        sh: basename "$(nix eval --raw .#nixosConfigurations.tests-server._module.specialArgs.hostSpec.sopsFile)" .yaml
      # tests-server mounts its own environment's share at /mnt/backups and
      # the other one at /mnt/<otherEnv>-backups (nfsclient.nix), so a
      # source in the other environment (e.g. SOURCE_HOST=amos1) is read
      # through the cross-mount.
      #
      # The VM's NFS traffic leaves through the workstation's user-mode NAT
      # from an unprivileged source port, so the source share's NFS rule
      # must allow that (`insecure`; DSM "Allow connections from
      # non-privileged ports"). server-dev-backups allows it for the /24;
      # server-prod-backups only for the workstation's own IP. Without it
      # the mount fails with "access denied by server" and restic retries
      # `stat .../config: no such device` indefinitely.
      #
      # Jellyfin cannot restore across environments: its state is owned by
      # server-<env> (uid 1029 dev, 1030 prod), so a prod snapshot leaves
      # it unreadable to server-dev and the health probe times out.
      # Until that is fixed (#958), SOURCE_HOST=amos1 stops at jellyfin;
      # restore paperless-ngx on its own with `task recovery:app`.
      REPO_MOUNT:
        sh: |
          src=$(nix eval --raw .#nixosConfigurations.{{.SOURCE_HOST}}._module.specialArgs.hostSpec.serverEnvironment)
          vm=$(nix eval --raw .#nixosConfigurations.tests-server._module.specialArgs.hostSpec.serverEnvironment)
          if [ "$src" = "$vm" ]; then echo /mnt/backups; else echo "/mnt/$src-backups"; fi
    cmds:
      - task: :vm:up
      - task: :vm:sops-authorize
        vars: {TARGET: '{{.VM_SOPS_TARGET}}'}
      # bootstrap:install with LOCAL_SECRETS=true pre-builds against local
      # repo state, so the installed system already carries the
      # uncommitted sops envelope edits the previous step just made. Not
      # bootstrap:reinstall: that flow also runs sync + rebuild on the
      # target afterwards, but for this drill we only
      # need the install — the per-app restore subtasks below are the
      # actual signal, and a full rebuild on a freshly-installed
      # tests-server would fail on harmless degraded units (loki/radarr
      # expecting NFS content paths). Call
      # bootstrap:install directly with the persistent key from vm:up.
      - task: :bootstrap:install
        vars:
          HOST: tests-server
          DEST: 127.0.0.1
          SSH_PORT: '{{.SSH_PORT}}'
          IMPERMANENT: 'true'
          SSH_HOST_KEY_FILE: '{{.HOME}}/vms/nixos-vm/ssh_host_ed25519_key'
          LOCAL_SECRETS: 'true'
      - |
        set -euo pipefail
        # 12 min, matching vm:install. See the script for why readiness
        # is multi-user.target rather than is-system-running.
        ./scripts/wait-for-boot.sh ipreston 127.0.0.1 {{.SSH_PORT}} 12
      - |
        set -euo pipefail
        # Seed sentinel files inside the paths the upcoming restores
        # will --include. If the snapshot doesn't contain these names
        # (and it won't — they're random), --delete should remove them,
        # locking in clean-restore semantics. See issue #217.
        #
        # The jellyfin sentinel must sit in one of the enumerated state
        # subdirs, not in /var/lib/jellyfin itself: #569 narrowed that
        # app's includes to data/config/plugins/root so a partial
        # restore can't wipe the unbacked-up metadata/ tree, and
        # --delete only reaches inside an included path. A sentinel on
        # the parent therefore always survives and asserts nothing.
        #
        # paperless-ngx gets two. The llm_index/ one is the point: the
        # vector store is excluded from backup (#558), so the module
        # relies on --delete to clear a stale index on restore.
        echo -e "\x1B[32m[+] Seeding sentinel files to verify clean-restore semantics\x1B[0m"
        ssh -p {{.SSH_PORT}} -o StrictHostKeyChecking=accept-new ipreston@127.0.0.1 \
          'sudo bash -se' <<'EOF'
        set -euo pipefail
        mkdir -p /var/lib/containers/bookorbit /var/lib/jellyfin/data /var/backup/sqlite/jellyfin \
          /var/lib/paperless-ngx/llm_index
        touch /var/lib/containers/bookorbit/.recovery-overlay-sentinel
        touch /var/lib/jellyfin/data/.recovery-overlay-sentinel
        touch /var/backup/sqlite/jellyfin/.recovery-overlay-sentinel
        touch /var/lib/paperless-ngx/.recovery-overlay-sentinel
        touch /var/lib/paperless-ngx/llm_index/.recovery-overlay-sentinel
        echo "[+] sentinels placed"
        EOF
      - task: app
        vars: {APP: bookorbit, HOST: tests-server, DEST: 127.0.0.1, SSH_PORT: '{{.SSH_PORT}}', SOURCE_HOST: '{{.SOURCE_HOST}}', REPO_MOUNT: '{{.REPO_MOUNT}}'}
      - task: app
        vars: {APP: miniflux, HOST: tests-server, DEST: 127.0.0.1, SSH_PORT: '{{.SSH_PORT}}', SOURCE_HOST: '{{.SOURCE_HOST}}', REPO_MOUNT: '{{.REPO_MOUNT}}'}
      - task: app
        vars: {APP: jellyfin, HOST: tests-server, DEST: 127.0.0.1, SSH_PORT: '{{.SSH_PORT}}', SOURCE_HOST: '{{.SOURCE_HOST}}', REPO_MOUNT: '{{.REPO_MOUNT}}'}
      - task: app
        vars: {APP: paperless-ngx, HOST: tests-server, DEST: 127.0.0.1, SSH_PORT: '{{.SSH_PORT}}', SOURCE_HOST: '{{.SOURCE_HOST}}', REPO_MOUNT: '{{.REPO_MOUNT}}'}
      - |
        set -euo pipefail
        echo -e "\x1B[32m[+] Asserting sentinels were removed by --delete\x1B[0m"
        ssh -p {{.SSH_PORT}} ipreston@127.0.0.1 'sudo bash -se' <<'EOF'
        set -euo pipefail
        failed=0
        for f in \
          /var/lib/containers/bookorbit/.recovery-overlay-sentinel \
          /var/lib/jellyfin/data/.recovery-overlay-sentinel \
          /var/backup/sqlite/jellyfin/.recovery-overlay-sentinel \
          /var/lib/paperless-ngx/.recovery-overlay-sentinel \
          /var/lib/paperless-ngx/llm_index/.recovery-overlay-sentinel; do
          if [ -e "$f" ]; then
            echo "[!] OVERLAY REGRESSION: $f survived restore"
            failed=1
          else
            echo "[+] OK: $f removed by --delete"
          fi
        done
        exit "$failed"
        EOF
      - task: :vm:down
      - |
        echo ""
        echo -e "\x1B[32m========================================================\x1B[0m"
        echo -e "\x1B[32m  Full restore drill PASSED (tests-server VM, source {{.SOURCE_HOST}})\x1B[0m"
        echo -e "\x1B[32m  Bootstrap + all four drill apps restored cleanly.\x1B[0m"
        echo -e "\x1B[32m========================================================\x1B[0m"
        echo -e "\x1B[33m  Reminder: ../nix-secrets/ now has uncommitted sops envelope changes\x1B[0m"
        echo -e "\x1B[33m  authorizing the VM key. \`cd ../nix-secrets && git restore .\` to revoke,\x1B[0m"
        echo -e "\x1B[33m  or, on a nix-secrets branch, \`task secrets:publish MSG=\"authorize VM\"\` to make sticky.\x1B[0m"

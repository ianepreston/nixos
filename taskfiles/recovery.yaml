---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Recovery tasks — per-app and whole-host restore from restic.
#
# ## Usage
#
#   task recovery:app APP=<app>         # in-place restore on HOST
#       HOST=hpp-1
#       [DEST=<ip-or-host>]              # default: same as HOST
#       [SOURCE_HOST=<other-host>]       # default: same as HOST
#       [MANIFEST_HOST=<flake-host>]     # default: HOST
#
# Set MANIFEST_HOST when HOST/DEST is an IP address or another non-flake
# target name; it selects the configuration whose enabled app metadata is used.
#
# `recovery:app` dispatches to one of three restore templates
# (`_restore-volume`, `_restore-pg`, `_restore-sqlite`) and then runs
# an HTTP health check via `_health` where applicable. `recovery:all`
# runs every enabled app through it in manifest order — use it for
# catastrophic rebuilds.
#
# App modules own recovery metadata. The generated manifest drives both
# `recovery:app` and `recovery:all`; this file only owns the reusable restore
# mechanics.
#
# ## Verification drill (recovery:test:full)
#
# Spins up a tests-server quickemu VM, reinstalls it from this flake,
# restores bookorbit + miniflux + jellyfin from SOURCE_HOST's restic repo
# (exercising the three app shapes), and tears the VM down. Quarterly
# cadence — see issue #135 for the rationale.
version: '3'
set: [pipefail]
shopt: [globstar]
tasks:
  # ---------------------------------------------------------------------------
  # Internal templates
  # ---------------------------------------------------------------------------
  #
  # These do the actual restic + systemd + (postgres|sqlite) dance.
  # `recovery:app` below picks one per manifest entry and populates
  # UNITS / PATHS / DB / SWAPS. Carrying no `desc:` is what keeps them
  # out of `task --list`; they deliberately do NOT set `internal: true`.
  # The dispatcher chooses the template at runtime from the manifest's
  # `kind`, which YAML `- task:` references can't express, so it shells
  # out to `task recovery:_restore-*` — and Go Task refuses a CLI
  # invocation of an internal task with exit 202.
  #
  # All three run `restic unlock` and then pass `--retry-lock 10m`.
  # `restic restore` takes a read lock, and the nightly `forget --prune`
  # holds an exclusive one for ~47s at ~03:2x; restic retries zero times
  # by default, so a recovery that happened to overlap would abort with
  # exit 11 partway through (#676). Waiting beats failing mid-restore.
  #
  # The `unlock` is not redundant with the retry, it is what keeps the
  # retry from making things worse. `checkForOtherLocks` (restic 0.18.1,
  # internal/restic/lock.go:160) never consults `Stale()` — only the
  # `unlock` command does — so a lock left behind by a dead process
  # blocks acquisition just like a live one, and the retry burns the
  # full 10m before failing anyway. A crash that leaves a stale lock on
  # the repo is exactly the crash that leads to a recovery, and
  # `recovery:all` chains every app in sequence. nixpkgs runs `restic
  # unlock` before the nightly prune for this reason; these templates
  # need their own.
  _restore-volume:
    requires:
      vars: [HOST, APP, UNITS, PATHS]
    vars:
      DEST: '{{.DEST | default .HOST}}'
      SOURCE_HOST: '{{.SOURCE_HOST | default .HOST}}'
      SSH_PORT: '{{.SSH_PORT | default "22"}}'
      TARGET_USER: '{{.TARGET_USER | default "ipreston"}}'
      # Override for cross-environment restore (dev→prod or prod→dev).
      # Defaults to /mnt/backups (same-environment); set to
      # /mnt/<otherEnv>-backups when SOURCE_HOST lives in the other env.
      REPO_MOUNT: '{{.REPO_MOUNT | default "/mnt/backups"}}'
    cmds:
      - |
        set -euo pipefail
        echo -e "\x1B[32m[+] Restoring {{.APP}} on {{.HOST}} (volume-only) from {{.SOURCE_HOST}}'s restic repo\x1B[0m"
        ssh -p {{.SSH_PORT}} -oForwardAgent=yes {{.TARGET_USER}}@{{.DEST}} \
          'sudo bash -se' <<EOF
        set -euo pipefail
        REPO={{.REPO_MOUNT}}/restic/{{.SOURCE_HOST}}
        PASS_FILE=/run/secrets/restic/password

        for u in {{.UNITS}}; do
          echo "[+] Stopping \$u"
          systemctl stop "\$u" || true
        done

        includes=""
        for p in {{.PATHS}}; do
          includes="\$includes --include \$p"
        done
        echo "[+] Restoring paths: {{.PATHS}}"
        # --delete: remove files at the destination within the included
        # paths that aren't in the snapshot. Makes restore a clean
        # operation rather than an overlay — see issue #217.
        # shellcheck disable=SC2086
        restic -r "\$REPO" --password-file "\$PASS_FILE" unlock
        restic -r "\$REPO" --password-file "\$PASS_FILE" --retry-lock 10m \
          restore latest --target / --delete \$includes

        for u in {{.UNITS}}; do
          echo "[+] Starting \$u"
          systemctl start "\$u"
        done
        EOF
  _restore-pg:
    requires:
      vars: [HOST, APP, UNITS, DB]
    vars:
      DEST: '{{.DEST | default .HOST}}'
      SOURCE_HOST: '{{.SOURCE_HOST | default .HOST}}'
      SSH_PORT: '{{.SSH_PORT | default "22"}}'
      TARGET_USER: '{{.TARGET_USER | default "ipreston"}}'
      # Extra non-postgres paths to restore alongside /var/backup/postgresql
      # (e.g. /var/lib/<app> for native apps with on-disk state, or
      # /var/lib/containers/<app> for containerized + pg shapes).
      PATHS: '{{.PATHS | default ""}}'
      # See _restore-volume for REPO_MOUNT semantics.
      REPO_MOUNT: '{{.REPO_MOUNT | default "/mnt/backups"}}'
    cmds:
      - |
        set -euo pipefail
        echo -e "\x1B[32m[+] Restoring {{.APP}} on {{.HOST}} (postgres + paths) from {{.SOURCE_HOST}}'s restic repo\x1B[0m"
        ssh -p {{.SSH_PORT}} -oForwardAgent=yes {{.TARGET_USER}}@{{.DEST}} \
          'sudo bash -se' <<EOF
        set -euo pipefail
        REPO={{.REPO_MOUNT}}/restic/{{.SOURCE_HOST}}
        PASS_FILE=/run/secrets/restic/password
        DB={{.DB}}

        for u in {{.UNITS}}; do
          echo "[+] Stopping \$u"
          systemctl stop "\$u" || true
        done

        includes="--include /var/backup/postgresql"
        for p in {{.PATHS}}; do
          includes="\$includes --include \$p"
        done
        echo "[+] Restoring /var/backup/postgresql {{.PATHS}}"
        # --delete: see comment in _restore-volume.
        # shellcheck disable=SC2086
        restic -r "\$REPO" --password-file "\$PASS_FILE" unlock
        restic -r "\$REPO" --password-file "\$PASS_FILE" --retry-lock 10m \
          restore latest --target / --delete \$includes

        echo "[+] Replaying \$DB database from pg_dumpall"
        sudo -u postgres dropdb --if-exists "\$DB"
        sudo -u postgres createdb -O "\$DB" "\$DB"
        # pg_dumpall layout: \connect <db> introduces a section, but
        # CREATE DATABASE <next>; for the SUCCEEDING db appears between
        # the current \connect block and the next \connect — so flip
        # in_target off on both, or psql will try to recreate already-
        # provisioned databases.
        zcat /var/backup/postgresql/all.sql.gz | awk -v db="\$DB" '
          /^\\\\connect / { name = \$2; gsub(/"/, "", name); in_target = (name == db); next }
          /^CREATE DATABASE / { in_target = 0; next }
          in_target { print }
        ' | sudo -u postgres psql -v ON_ERROR_STOP=1 "\$DB"

        for u in {{.UNITS}}; do
          echo "[+] Starting \$u"
          systemctl start "\$u"
        done
        EOF
  _restore-sqlite:
    requires:
      vars: [HOST, APP, UNITS, PATHS, SWAPS]
    vars:
      DEST: '{{.DEST | default .HOST}}'
      SOURCE_HOST: '{{.SOURCE_HOST | default .HOST}}'
      SSH_PORT: '{{.SSH_PORT | default "22"}}'
      TARGET_USER: '{{.TARGET_USER | default "ipreston"}}'
      # SWAPS format: space-separated triples "src:dst:owner". The
      # token "@env@" in `owner` is replaced with "server-<env>" where
      # <env> is detected from /etc/passwd on the target — lets one
      # SWAPS string apply on both server-dev and server-prod hosts.
      # See _restore-volume for REPO_MOUNT semantics.
      REPO_MOUNT: '{{.REPO_MOUNT | default "/mnt/backups"}}'
    cmds:
      - |
        set -euo pipefail
        echo -e "\x1B[32m[+] Restoring {{.APP}} on {{.HOST}} (sqlite-quiesce) from {{.SOURCE_HOST}}'s restic repo\x1B[0m"
        ssh -p {{.SSH_PORT}} -oForwardAgent=yes {{.TARGET_USER}}@{{.DEST}} \
          'sudo bash -se' <<EOF
        set -euo pipefail
        REPO={{.REPO_MOUNT}}/restic/{{.SOURCE_HOST}}
        PASS_FILE=/run/secrets/restic/password

        SERVER_USER=\$(getent passwd server-prod >/dev/null && echo server-prod || echo server-dev)

        for u in {{.UNITS}}; do
          echo "[+] Stopping \$u"
          systemctl stop "\$u" || true
        done

        includes=""
        for p in {{.PATHS}}; do
          includes="\$includes --include \$p"
        done
        echo "[+] Restoring paths: {{.PATHS}}"
        # --delete: see comment in _restore-volume.
        # shellcheck disable=SC2086
        restic -r "\$REPO" --password-file "\$PASS_FILE" unlock
        restic -r "\$REPO" --password-file "\$PASS_FILE" --retry-lock 10m \
          restore latest --target / --delete \$includes

        for triple in {{.SWAPS}}; do
          IFS=":" read -r src dst owner <<<"\$triple"
          owner=\${owner//@env@/\$SERVER_USER}
          echo "[+] Swapping \$dst <- \$src (owner: \$owner)"
          install -o "\$owner" -g servers -m 0640 "\$src" "\$dst"
        done

        for u in {{.UNITS}}; do
          echo "[+] Starting \$u"
          systemctl start "\$u"
        done
        EOF
  _health:
    requires:
      vars: [HOST, APP, URL]
    vars:
      DEST: '{{.DEST | default .HOST}}'
      SSH_PORT: '{{.SSH_PORT | default "22"}}'
      TARGET_USER: '{{.TARGET_USER | default "ipreston"}}'
      EXPECT: '{{.EXPECT | default "200"}}'
      RETRIES: '{{.RETRIES | default "30"}}'
      SLEEP: '{{.SLEEP | default "2"}}'
    cmds:
      - |
        set -euo pipefail
        echo -e "\x1B[32m[+] Asserting HTTP {{.EXPECT}} on {{.APP}} ({{.URL}})\x1B[0m"
        # -n: this is the one template ssh with no heredoc on stdin. Under
        # `recovery:all` it would otherwise inherit the caller's app-list
        # pipe and swallow it — see the comment on that loop.
        ssh -n -p {{.SSH_PORT}} {{.TARGET_USER}}@{{.DEST}} "
          set -euo pipefail
          for i in \$(seq 1 {{.RETRIES}}); do
            code=\$(curl -s -o /dev/null -w '%{http_code}' '{{.URL}}' || true)
            if [ \"\$code\" = '{{.EXPECT}}' ]; then echo '{{.APP}}: {{.EXPECT}} OK'; exit 0; fi
            sleep {{.SLEEP}}
          done
          echo '{{.APP}}: did not return {{.EXPECT}} within {{.RETRIES}}x{{.SLEEP}}s (last code: '\$code')'
          exit 1
        "
  # ---------------------------------------------------------------------------
  # Manifest-driven dispatch
  # ---------------------------------------------------------------------------
  # App modules expose the facts each existing restore template needs through
  # `myRecovery.manifest`. There is deliberately no per-app Task registry:
  # invoke one app with `task recovery:app APP=<name> HOST=<host>`.
  app:
    desc: Restore APP on HOST using the Nix-generated recovery manifest
    requires: {vars: [HOST, APP]}
    vars:
      MANIFEST_HOST: "{{.MANIFEST_HOST | default .HOST}}"
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.MANIFEST_FILE}}" ]; then
          manifest="$(cat "{{.MANIFEST_FILE}}")"
        else
          manifest="$(nix eval --json ".#nixosConfigurations.{{.MANIFEST_HOST}}.config.myRecovery.manifest")"
        fi
        app="$(printf "%s" "$manifest" | jq -ce --arg app "{{.APP}}" '.[$app] // error("unknown recovery app: \($app)")')"
        kind="$(printf "%s" "$app" | jq -r .kind)"
        units="$(printf "%s" "$app" | jq -r ".units | join(\" \")")"
        paths="$(printf "%s" "$app" | jq -r ".paths | join(\" \")")"

        case "$kind" in
          volume)
            task recovery:_restore-volume HOST="{{.HOST}}" APP="{{.APP}}" UNITS="$units" PATHS="$paths" DEST="{{.DEST}}" SOURCE_HOST="{{.SOURCE_HOST}}" SSH_PORT="{{.SSH_PORT}}" TARGET_USER="{{.TARGET_USER}}" REPO_MOUNT="{{.REPO_MOUNT}}"
            ;;
          postgres)
            database="$(printf "%s" "$app" | jq -r .database)"
            task recovery:_restore-pg HOST="{{.HOST}}" APP="{{.APP}}" UNITS="$units" PATHS="$paths" DB="$database" DEST="{{.DEST}}" SOURCE_HOST="{{.SOURCE_HOST}}" SSH_PORT="{{.SSH_PORT}}" TARGET_USER="{{.TARGET_USER}}" REPO_MOUNT="{{.REPO_MOUNT}}"
            ;;
          sqlite)
            swaps="$(printf "%s" "$app" | jq -r ".swaps | map([.staged, .live, .owner] | join(\":\")) | join(\" \")")"
            task recovery:_restore-sqlite HOST="{{.HOST}}" APP="{{.APP}}" UNITS="$units" PATHS="$paths" SWAPS="$swaps" DEST="{{.DEST}}" SOURCE_HOST="{{.SOURCE_HOST}}" SSH_PORT="{{.SSH_PORT}}" TARGET_USER="{{.TARGET_USER}}" REPO_MOUNT="{{.REPO_MOUNT}}"
            ;;
          *)
            echo "unknown recovery kind: $kind" >&2
            exit 1
            ;;
        esac

        if [ "$(printf "%s" "$app" | jq -r ".health != null")" = true ]; then
          health="$(printf "%s" "$app" | jq -c .health)"
          task recovery:_health HOST="{{.HOST}}" APP="{{.APP}}" URL="$(printf "%s" "$health" | jq -r .url)" EXPECT="$(printf "%s" "$health" | jq -r .expect)" RETRIES="$(printf "%s" "$health" | jq -r .retries)" SLEEP="$(printf "%s" "$health" | jq -r .sleep)" DEST="{{.DEST}}" SSH_PORT="{{.SSH_PORT}}" TARGET_USER="{{.TARGET_USER}}"
        fi
  # ---------------------------------------------------------------------------
  # Catastrophic restore - every enabled app on this flake host
  # ---------------------------------------------------------------------------
  # `order` is declared beside each app and preserves the prior sequence:
  # authentik first, followed by the independent apps in their existing order.
  all:
    desc: Catastrophic restore - every enabled app on HOST from SOURCE_HOST (default same host)
    requires: {vars: [HOST]}
    vars:
      MANIFEST_HOST: "{{.MANIFEST_HOST | default .HOST}}"
    cmds:
      - |
        set -euo pipefail
        manifest_file="$(mktemp)"
        trap "rm -f $manifest_file" EXIT
        nix eval --json ".#nixosConfigurations.{{.MANIFEST_HOST}}.config.myRecovery.manifest" >"$manifest_file"
        # `</dev/null` on the dispatcher is load-bearing, not tidiness. The
        # loop reads its app list from the jq pipe, and every `ssh` under
        # `recovery:app` that is not fed a heredoc (the `_health` probe)
        # inherits that pipe as its own stdin and drains the remaining app
        # names. Without this the chain restores up to the first app with a
        # health probe, then the loop ends — and exits 0, reporting a
        # catastrophic restore as successful. `_health` also passes `ssh -n`;
        # both halves stay.
        jq -r "to_entries | sort_by(.value.order) | .[].key" "$manifest_file" |
          while IFS= read -r app; do
            task recovery:app APP="$app" HOST="{{.HOST}}" MANIFEST_HOST="{{.MANIFEST_HOST}}" MANIFEST_FILE="$manifest_file" DEST="{{.DEST}}" SOURCE_HOST="{{.SOURCE_HOST}}" SSH_PORT="{{.SSH_PORT}}" TARGET_USER="{{.TARGET_USER}}" REPO_MOUNT="{{.REPO_MOUNT}}" </dev/null
          done
  # ---------------------------------------------------------------------------
  # End-to-end drill: VM up → install → restore three shapes → teardown
  # ---------------------------------------------------------------------------
  # Confirms last night's restic snapshot is actually replayable into a
  # working app for each of the three app shapes (containerized + pg,
  # native + pg only, native + sqlite-quiesce). Quarterly. See issue
  # #135 for the rationale.
  #
  # VM lifecycle (up/install/down/sops-authorize) lives under `task vm:*`
  # in taskfiles/vm.yaml — generic enough to also drive tests-desktop
  # iteration and not tied to the restore drill.
  test:full:
    desc: Quarterly end-to-end drill — VM up, reinstall, restore bookorbit/miniflux/jellyfin from SOURCE_HOST, teardown
    vars:
      SOURCE_HOST: '{{.SOURCE_HOST | default "hpp-1"}}'
      SSH_PORT: '{{.SSH_PORT | default "22322"}}'
    cmds:
      - task: :vm:up
      - task: :vm:sops-authorize
        vars: {TARGET: '{{.SOURCE_HOST}}'}
      # vm:install routes through bootstrap:reinstall with LOCAL_SECRETS=true
      # (default), so the installed system already reflects local repo
      # state — including the uncommitted sops envelope edits the previous
      # step just made. The bootstrap:reinstall flow also runs sync +
      # rebuild on the target afterwards, but for this drill we only
      # need the install — the per-app restore subtasks below are the
      # actual signal, and a full rebuild on a freshly-installed
      # tests-server would fail on harmless degraded units (tailscale
      # authkey, loki/radarr expecting NFS content paths). Call
      # bootstrap:install directly with the persistent key from vm:up.
      - task: :bootstrap:install
        vars:
          HOST: tests-server
          DEST: 127.0.0.1
          SSH_PORT: '{{.SSH_PORT}}'
          IMPERMANENT: 'true'
          SSH_HOST_KEY_FILE: '{{.HOME}}/vms/nixos-vm/ssh_host_ed25519_key'
          LOCAL_SECRETS: 'true'
      - |
        set -euo pipefail
        echo -e "\x1B[32m[+] Waiting for tests-server to reboot into installed system\x1B[0m"
        ssh-keygen -R "127.0.0.1" -f ~/.ssh/known_hosts 2>/dev/null || true
        ssh-keygen -R "[127.0.0.1]:{{.SSH_PORT}}" -f ~/.ssh/known_hosts 2>/dev/null || true
        # Readiness is `multi-user.target` being active, NOT
        # `systemctl is-system-running` returning running|degraded. That
        # state is effectively unreachable on a freshly installed
        # tests-server: radarr cannot start without the NFS content paths a
        # VM does not have, decluttarr's pre-start polls radarr and fails,
        # and its Restart= loop keeps a start job queued every ~30s.
        # `is-system-running` reports `starting` until the job queue goes
        # idle *for the first time*, so it only flips during the brief gap
        # between one decluttarr attempt exiting and the next being queued —
        # a gap a 3s poll routinely steps over. Measured on 2026-09-23:
        # multi-user.target active at 2min36 and stable thereafter, while
        # the old loop polled for a full 12 min without once catching an
        # idle window. The 6 min version before it never caught one either;
        # it simply had no failure branch and fell through silently, which
        # is how this step has always "passed".
        #
        # running|degraded is still accepted as an early exit for hosts
        # whose units all settle — it just isn't required.
        #
        # 240 iterations * 3s = 12 min, matching vm:install. tests-server's
        # first boot (server-apps stack) takes 4-8 min, so 6 min was too
        # short regardless.
        for i in $(seq 1 240); do
          state=$(ssh -p {{.SSH_PORT}} -o ConnectTimeout=2 -o BatchMode=yes \
                      -o StrictHostKeyChecking=accept-new \
                      -o UpdateHostKeys=no \
                      ipreston@127.0.0.1 \
                      'systemctl is-active multi-user.target || true;
                       systemctl is-system-running || true' \
                      2>/dev/null | paste -sd, - || echo connecting)
          case "$state" in
            active,*|*,running|*,degraded)
              echo -e "\x1B[32m[+] Target reachable (multi-user.target + systemd: $state)\x1B[0m"
              exit 0
              ;;
            *)
              sleep 3
              ;;
          esac
        done
        echo -e "\x1B[31m[!] tests-server did not come up within 12 minutes after install\x1B[0m"
        exit 1
      - |
        set -euo pipefail
        # Seed sentinel files inside the paths the upcoming restores
        # will --include. If the snapshot doesn't contain these names
        # (and it won't — they're random), --delete should remove them,
        # locking in clean-restore semantics. See issue #217.
        #
        # The jellyfin sentinel must sit in one of the enumerated state
        # subdirs, not in /var/lib/jellyfin itself: #569 narrowed that
        # app's includes to data/config/plugins/root so a partial
        # restore can't wipe the unbacked-up metadata/ tree, and
        # --delete only reaches inside an included path. A sentinel on
        # the parent therefore always survives and asserts nothing.
        echo -e "\x1B[32m[+] Seeding sentinel files to verify clean-restore semantics\x1B[0m"
        ssh -p {{.SSH_PORT}} -o StrictHostKeyChecking=accept-new ipreston@127.0.0.1 \
          'sudo bash -se' <<'EOF'
        set -euo pipefail
        mkdir -p /var/lib/containers/bookorbit /var/lib/jellyfin/data /var/backup/sqlite/jellyfin
        touch /var/lib/containers/bookorbit/.recovery-overlay-sentinel
        touch /var/lib/jellyfin/data/.recovery-overlay-sentinel
        touch /var/backup/sqlite/jellyfin/.recovery-overlay-sentinel
        echo "[+] sentinels placed"
        EOF
      - task: app
        vars: {APP: bookorbit, HOST: tests-server, DEST: 127.0.0.1, SSH_PORT: '{{.SSH_PORT}}', SOURCE_HOST: '{{.SOURCE_HOST}}'}
      - task: app
        vars: {APP: miniflux, HOST: tests-server, DEST: 127.0.0.1, SSH_PORT: '{{.SSH_PORT}}', SOURCE_HOST: '{{.SOURCE_HOST}}'}
      - task: app
        vars: {APP: jellyfin, HOST: tests-server, DEST: 127.0.0.1, SSH_PORT: '{{.SSH_PORT}}', SOURCE_HOST: '{{.SOURCE_HOST}}'}
      - |
        set -euo pipefail
        echo -e "\x1B[32m[+] Asserting sentinels were removed by --delete\x1B[0m"
        ssh -p {{.SSH_PORT}} ipreston@127.0.0.1 'sudo bash -se' <<'EOF'
        set -euo pipefail
        failed=0
        for f in \
          /var/lib/containers/bookorbit/.recovery-overlay-sentinel \
          /var/lib/jellyfin/data/.recovery-overlay-sentinel \
          /var/backup/sqlite/jellyfin/.recovery-overlay-sentinel; do
          if [ -e "$f" ]; then
            echo "[!] OVERLAY REGRESSION: $f survived restore"
            failed=1
          else
            echo "[+] OK: $f removed by --delete"
          fi
        done
        exit "$failed"
        EOF
      - task: :vm:down
      - |
        echo ""
        echo -e "\x1B[32m========================================================\x1B[0m"
        echo -e "\x1B[32m  Full restore drill PASSED (tests-server VM, source {{.SOURCE_HOST}})\x1B[0m"
        echo -e "\x1B[32m  Bootstrap + all three app shapes restored cleanly.\x1B[0m"
        echo -e "\x1B[32m========================================================\x1B[0m"
        echo -e "\x1B[33m  Reminder: ../nix-secrets/ now has uncommitted sops envelope changes\x1B[0m"
        echo -e "\x1B[33m  authorizing the VM key. \`cd ../nix-secrets && git restore .\` to revoke,\x1B[0m"
        echo -e "\x1B[33m  or \`task secrets:publish\` to make sticky.\x1B[0m"

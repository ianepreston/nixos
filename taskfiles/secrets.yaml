---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Secrets management for the nix-secrets repo (consumed as a flake input).
# Wraps `sops` so we generate high-entropy values into the right keys instead
# of editing yaml by hand.
#
# Every task acts on SECRETS_DIR: `SECRETS_DIR=<checkout>` (CLI or env), else
# NIX_SECRETS_PATH, else ../nix-secrets beside this checkout or beside the
# primary checkout of a linked worktree (scripts/secrets-dir.sh). Pass an
# explicit checkout to keep concurrent jobs in separate nix-secrets worktrees.
#
# All generators default to HOST=hpp-1 and refuse to overwrite an existing
# key unless FORCE=true. Then `task secrets:publish MSG="..."` commits the
# sops changes, pushes the checkout's branch and pins the flake input to that
# exact commit; `task secrets:pin-main` restores the canonical main input
# (docs/agents/secrets.md).
version: '3'
set: [pipefail]
shopt: [globstar]
vars:
  SECRETS_DIR:
    sh: bash "{{.ROOT_DIR}}/scripts/secrets-dir.sh" "{{.ROOT_DIR}}"
tasks:
  rekey:
    desc: Re-encrypt every sops/*.yaml in nix-secrets against current .sops.yaml rules
    cmds:
      - |
        set -euo pipefail
        cd "{{.SECRETS_DIR}}"
        for f in sops/*.yaml; do
          echo -e "\x1B[32m[+] updatekeys $f\x1B[0m"
          sops updatekeys --yes "$f"
        done

  matrix:
    desc: Check every sops file's recipients against what each host's config reads (positive and negative)
    silent: true
    summary: |
      Evaluates every nixosConfiguration (NixOS + home-manager secrets)
      against SECRETS_DIR, keyscans each host's live SSH host key, and
      fails if a host can't decrypt a file it reads, can decrypt one it
      doesn't, or an operator identity is missing. Public keys only.
      See scripts/sops-recipient-matrix.py. OFFLINE=true skips keyscan.
    vars:
      OFFLINE: '{{.OFFLINE | default "false"}}'
    cmds:
      - |
        set -euo pipefail
        consumers=$(mktemp)
        trap 'rm -f "$consumers"' EXIT
        nix eval --json .#nixosConfigurations \
          --apply "$(cat scripts/_sops-matrix/consumers.nix)" \
          --override-input nix-secrets "path:$(realpath "{{.SECRETS_DIR}}")" >"$consumers"
        nix shell --inputs-from . nixpkgs#python3 nixpkgs#ssh-to-age nixpkgs#yq-go -c \
          python3 -I scripts/sops-recipient-matrix.py \
            --secrets-dir "{{.SECRETS_DIR}}" --consumers "$consumers" \
            --vm-pubkey "{{.VM_DIR | default (printf "%s/vms/nixos-vm" .HOME)}}/ssh_host_ed25519_key.pub" \
            {{if eq .OFFLINE "true"}}--offline{{end}}

  edit:*:
    desc: Edit a host's secrets file (e.g. task secrets:edit:hpp-1)
    cmd: |
      cd "{{.SECRETS_DIR}}" && sops sops/{{index .MATCH 0}}.yaml

  view:*:
    desc: Decrypt and print a host's secrets (e.g. task secrets:view:hpp-1)
    cmd: |
      cd "{{.SECRETS_DIR}}" && sops -d sops/{{index .MATCH 0}}.yaml

  oidc:
    desc: 'Generate OIDC client_id + client_secret for APP on HOST. Vars: APP (required), HOST (default hpp-1), FORCE=true to overwrite'
    requires:
      vars: [APP]
    vars:
      HOST: '{{.HOST | default "hpp-1"}}'
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
      - |
        set -euo pipefail
        cd "{{.SECRETS_DIR}}"
        file="sops/{{.HOST}}.yaml"
        [ -f "$file" ] || { echo -e "\x1B[31m[!] $file not found in {{.SECRETS_DIR}}\x1B[0m" >&2; exit 1; }
        existing=$(sops -d "$file" | yq -r '.["{{.APP}}"].oidc_client_id // ""')
        if [ -n "$existing" ] && [ "{{.FORCE}}" != "true" ]; then
          echo -e "\x1B[31m[!] {{.APP}}.oidc_client_id already set in $file (use FORCE=true to overwrite)\x1B[0m" >&2
          exit 1
        fi
        client_id=$(openssl rand -hex 16)
        client_secret=$(openssl rand -hex 32)
        sops set "$file" '["{{.APP}}"]["oidc_client_id"]' "\"$client_id\""
        sops set "$file" '["{{.APP}}"]["oidc_client_secret"]' "\"$client_secret\""
        echo ""
        echo "===  OIDC creds set for {{.APP}} on {{.HOST}}  ==="
        echo "  client_id:     $client_id"
        echo "  client_secret: $client_secret"

  dbpw:
    desc: 'Generate db_password for APP on HOST. Vars: APP (required), HOST (default hpp-1), FORCE=true to overwrite'
    requires:
      vars: [APP]
    vars:
      HOST: '{{.HOST | default "hpp-1"}}'
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
      - |
        set -euo pipefail
        cd "{{.SECRETS_DIR}}"
        file="sops/{{.HOST}}.yaml"
        [ -f "$file" ] || { echo -e "\x1B[31m[!] $file not found in {{.SECRETS_DIR}}\x1B[0m" >&2; exit 1; }
        existing=$(sops -d "$file" | yq -r '.["{{.APP}}"].db_password // ""')
        if [ -n "$existing" ] && [ "{{.FORCE}}" != "true" ]; then
          echo -e "\x1B[31m[!] {{.APP}}.db_password already set in $file (use FORCE=true to overwrite)\x1B[0m" >&2
          exit 1
        fi
        password=$(openssl rand -hex 16)
        sops set "$file" '["{{.APP}}"]["db_password"]' "\"$password\""
        echo ""
        echo "===  db_password set for {{.APP}} on {{.HOST}}  ==="
        echo "  password: $password"

  publish:
    desc: 'Commit sops changes in SECRETS_DIR, push its branch explicitly and pin the nix-secrets input to that commit. Vars: MSG (required when SECRETS_DIR has uncommitted changes), SECRETS_DIR'
    summary: |
      Runs scripts/secrets-publish.sh publish (#1042). Refuses untracked
      files, a detached HEAD, uncommitted changes without MSG, unstaged
      changes outside sops/ and .sops.yaml, sops/ files without sops
      metadata, and a branch that does not contain the locked revision.
      Pushes HEAD to origin refs/heads/<branch> (never forced; the first
      push sets the upstream). On main it pins ?ref=main; on any other
      branch it pins ?ref=<branch>&rev=<commit> in flake.nix and the
      matching flake.lock entry, then prints the commit. Restore the main
      input with `task secrets:pin-main` before opening the NixOS PR.
    vars:
      MSG: '{{.MSG | default ""}}'
    cmds:
      - bash scripts/secrets-publish.sh publish --nixos-dir "{{.ROOT_DIR}}" --secrets-dir {{.SECRETS_DIR | shellQuote}} --message {{.MSG | shellQuote}}

  pin-main:
    desc: 'Point the nix-secrets input back at main and `nix flake update nix-secrets`. Vars: EXPECT (commit the new pin must contain), SECRETS_DIR'
    summary: |
      Runs scripts/secrets-publish.sh restore-main (#1042): rewrites the
      flake.nix url to ?ref=main, re-locks only nix-secrets, checks the
      other lock nodes are unchanged and prints the pinned commit. With
      EXPECT=<commit> (the one `task secrets:publish` printed) it fetches
      main in SECRETS_DIR and fails unless the pin descends from it.
    vars:
      EXPECT: '{{.EXPECT | default ""}}'
    cmds:
      - bash scripts/secrets-publish.sh restore-main --nixos-dir "{{.ROOT_DIR}}" {{if .EXPECT}}--secrets-dir {{.SECRETS_DIR | shellQuote}} --expect {{.EXPECT | shellQuote}}{{end}}

  secret:
    desc: 'Generate a generic high-entropy hex secret at APP.KEY. Vars: APP, KEY (required), HOST (default hpp-1), LEN (random bytes, default 32), FORCE=true to overwrite'
    requires:
      vars: [APP, KEY]
    vars:
      HOST: '{{.HOST | default "hpp-1"}}'
      LEN: '{{.LEN | default "32"}}'
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
      - |
        set -euo pipefail
        cd "{{.SECRETS_DIR}}"
        file="sops/{{.HOST}}.yaml"
        [ -f "$file" ] || { echo -e "\x1B[31m[!] $file not found in {{.SECRETS_DIR}}\x1B[0m" >&2; exit 1; }
        existing=$(sops -d "$file" | yq -r '.["{{.APP}}"]["{{.KEY}}"] // ""')
        if [ -n "$existing" ] && [ "{{.FORCE}}" != "true" ]; then
          echo -e "\x1B[31m[!] {{.APP}}.{{.KEY}} already set in $file (use FORCE=true to overwrite)\x1B[0m" >&2
          exit 1
        fi
        value=$(openssl rand -hex {{.LEN}})
        sops set "$file" '["{{.APP}}"]["{{.KEY}}"]' "\"$value\""
        echo ""
        echo "===  {{.APP}}.{{.KEY}} set on {{.HOST}}  ==="
        echo "  value: $value"

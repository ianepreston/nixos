---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Local LLM serving (see modules/system/llama-cpp.nix). Operator tasks for
# the one bit of llama-server state Nix deliberately doesn't manage: the
# GGUF cache.
#
# Model weights are downloaded by llama-server itself (`-hf`), not by nix,
# so they accumulate as `myLlamaCpp.models` changes — a 14B at Q4_K_M is
# ~9 GB a go. Nothing reclaims them automatically: an auto-prune on a
# timer would delete a model the moment a switch is half-applied, and the
# store's own GC has no visibility into /var/lib. So it's a task, and it
# defaults to a dry run.
#
# In router mode (#519) the cache is not just storage: llama-server
# enumerates it as a model *source*, so anything left in it is routable
# whether or not it is configured. Pruning is therefore how the served
# model list is kept equal to the declared one, not only how disk is
# reclaimed.
version: '3'
set: [pipefail]
shopt: [globstar]
tasks:
  radar:
    desc: 'Collect LLM leaderboard leads and draft deduplicated candidate issues. Vars: CANDIDATES=/path/to/evidenced-candidates.json'
    silent: true
    vars:
      CANDIDATES: '{{.CANDIDATES | default ""}}'
    cmds:
      - |
        set -euo pipefail
        radar_dir="${XDG_CACHE_HOME:-$HOME/.cache}/nixos-llm-radar"
        mkdir -p "$radar_dir"
        python3 scripts/llm-radar.py collect >"$radar_dir/leads.json"
        nix eval --json .#nixosConfigurations.terra.config.myLlamaCpp.evalTargets >"$radar_dir/terra.json"
        nix eval --json .#nixosConfigurations.amos1.config.myLlamaCpp.evalTargets >"$radar_dir/amos1.json"
        candidates="{{.CANDIDATES}}"
        [ -n "$candidates" ] || candidates="$radar_dir/leads.json"
        python3 scripts/llm-radar.py radar \
          --target "$radar_dir/terra.json" \
          --target "$radar_dir/amos1.json" \
          --candidates "$candidates" >"$radar_dir/drafts.json"
        echo "Dry-run report written to $radar_dir/drafts.json; no issue was created."

  # Eval harness (#555; the llm-eval skill drives it). gate and eval reach HOST through
  # scripts/llm-eval-connect.sh: loopback on the host itself, otherwise a
  # port forward on the existing ssh master (fails fast without one).
  #
  # Tier 0, `gate`: synthetic pass/fail probes of MODEL against ALIAS's
  # target in myLlamaCpp.evalTargets (tool-call round trip, input
  # modalities, the alias's full context, resident VRAM vs the host's
  # budget). Needs no fixtures; its output is safe to paste publicly.
  gate:
    desc: 'Tier-0 gates for MODEL against ALIAS on HOST. Vars: HOST (default terra), ALIAS (default text), MODEL (router name, default the alias incumbent), JSON (optional output path)'
    silent: true
    vars:
      HOST: '{{.HOST | default "terra"}}'
      ALIAS: '{{.ALIAS | default "text"}}'
      MODEL: '{{.MODEL | default ""}}'
      JSON: '{{.JSON | default ""}}'
    cmds:
      - |
        set -euo pipefail
        targets=$(nix eval --json ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.evalTargets")
        model="{{.MODEL}}"
        json="{{.JSON}}"
        case $json in "" | /*) ;; *) json="{{.USER_WORKING_DIR}}/$json" ;; esac
        scripts/llm-eval-connect.sh "{{.HOST}}" gate --targets "$targets" --alias "{{.ALIAS}}" \
          ${model:+--model "$model"} ${json:+--json "$json"}

  # Tier 1, `eval`: replays the private fixtures in ../nix-eval-fixtures
  # and writes scored results back into that repo's results/ — never into
  # this one. Absent checkout is a warning, not a failure.
  eval:
    desc: 'Replay private fixtures against MODEL on HOST and score them. Vars: HOST (default terra), MODEL (router name or alias, default text), FEATURE, ALIAS (cases targeting this alias), TRIALS (default 1), FIXTURES (default ../nix-eval-fixtures)'
    silent: true
    vars:
      HOST: '{{.HOST | default "terra"}}'
      MODEL: '{{.MODEL | default "text"}}'
      FEATURE: '{{.FEATURE | default ""}}'
      ALIAS: '{{.ALIAS | default ""}}'
      TRIALS: '{{.TRIALS | default "1"}}'
      FIXTURES: '{{.FIXTURES | default "../nix-eval-fixtures"}}'
    cmds:
      - |
        set -euo pipefail
        fixtures="{{.FIXTURES}}"
        if [ ! -d "$fixtures" ]; then
          echo "warning: no fixtures checkout at $fixtures; skipping" >&2
          exit 0
        fi
        feature="{{.FEATURE}}"
        alias="{{.ALIAS}}"
        scripts/llm-eval-connect.sh "{{.HOST}}" run --fixtures "$fixtures" \
          --model "{{.MODEL}}" --trials "{{.TRIALS}}" ${feature:+--feature "$feature"} \
          ${alias:+--alias "$alias"}

  # PUBLIC=true redacts the expected values that failed-check labels carry
  # (`tags:must:<name>` becomes `tags:must`), so the output can go in an
  # llm-candidate issue. Without it the output is private, like results/.
  eval:compare:
    desc: 'Markdown comparison of eval runs. Vars: RUNS="<run dir> <run dir> ..." (under ../nix-eval-fixtures/results), PUBLIC (true: safe for issue comments)'
    silent: true
    requires:
      vars: [RUNS]
    vars:
      PUBLIC: '{{.PUBLIC | default "false"}}'
    cmds:
      - |
        set -euo pipefail
        case "{{.PUBLIC}}" in
          true) public=--public ;;
          false) public= ;;
          *) echo "PUBLIC must be true or false, not '{{.PUBLIC}}'" >&2; exit 1 ;;
        esac
        nix shell --inputs-from . nixpkgs#python3 -c python3 scripts/llm-eval.py compare $public {{.RUNS}}

  # The last check before anything eval-derived goes on GitHub: fails if
  # FILE names any value an expected.json scores against. Case IDs are
  # allowed (they're public by contract). Prose written by hand is the one
  # path --public can't cover.
  eval:audit:
    desc: 'Fail if FILE (a draft issue comment or PR body) contains private fixture values. Vars: FILE, FIXTURES (default ../nix-eval-fixtures)'
    silent: true
    requires:
      vars: [FILE]
    vars:
      FIXTURES: '{{.FIXTURES | default "../nix-eval-fixtures"}}'
    cmds:
      - |
        set -euo pipefail
        file="{{.FILE}}"
        case $file in /*) ;; *) file="{{.USER_WORKING_DIR}}/$file" ;; esac
        nix shell --inputs-from . nixpkgs#python3 -c python3 scripts/llm-eval.py audit \
          --fixtures "{{.FIXTURES}}" "$file"

  models:
    desc: 'List cached GGUFs on HOST against the configured set (Darwin: local). Vars: HOST (default terra)'
    # The remote body is a heredoc; echoing it back drowns the listing.
    silent: true
    vars:
      HOST: '{{.HOST | default "terra"}}'
      TARGET_USER: '{{.TARGET_USER | default "ipreston"}}'
    cmds:
      - |
        set -euo pipefail
        platform=$(python3 scripts/llm-local.py --host "{{.HOST}}" platform)
        if [ "$platform" = darwin ]; then
          exec python3 scripts/llm-local.py --host "{{.HOST}}" models
        fi
        configured=$(nix eval --raw \
          ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.models" \
          --apply 'm: builtins.concatStringsSep " " m' 2>/dev/null || true)
        port=$(nix eval --raw --apply toString \
          ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.port" 2>/dev/null || echo 8080)
        cache_dir=$(nix eval --raw ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.cacheDirectory")
        key_file=$(nix eval --raw ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.apiKeyFile")
        echo -e "\x1B[32m[+] {{.HOST}} — configured models:\x1B[0m"
        for m in ${configured:-<none>}; do echo "      $m"; done
        ssh -oForwardAgent=yes {{.TARGET_USER}}@{{.HOST}} "sudo bash -se -- $port $cache_dir $key_file" <<'EOF'
        set -euo pipefail
        PORT=$1
        CACHE=$2
        ENV_FILE=$3
        [ -d "$CACHE" ] || { echo "no model cache at $CACHE"; exit 0; }

        key=$(grep -oP 'LLAMA_API_KEY=\K[^,]*' "$ENV_FILE" 2>/dev/null || true)
        # The router answers /v1/models without loading anything, and it
        # reports every model it would route to — the configured preset
        # *plus* whatever else is sitting in the cache. A name here that
        # is not in the configured list above is exactly what prune
        # removes.
        # Compact JSON on one line, one "id" per model entry — verified
        # against b9190 both with and without a model resident.
        routable=$(curl -sf --max-time 15 "http://127.0.0.1:${PORT}/v1/models" \
          ${key:+-H "Authorization: Bearer ${key}"} 2>/dev/null \
          | grep -oP '"id":\s*"\K[^"]+' || true)
        # Only one model has a child process at a time; /props answers for
        # it (including while it is asleep and has given its VRAM back —
        # replying does not wake it).
        live=""
        for m in $routable; do
          enc=$(printf '%s' "$m" | sed -e 's|/|%2F|g' -e 's|:|%3A|g')
          p=$(curl -sf --max-time 15 "http://127.0.0.1:${PORT}/props?model=${enc}&autoload=false" \
            ${key:+-H "Authorization: Bearer ${key}"} 2>/dev/null \
            | grep -oP '"model_path"\s*:\s*"\K[^"]+' || true)
          [ -n "$p" ] && live="$live $(readlink -f "$p")"
        done
        if [ -n "$routable" ]; then
          echo "routable via the router:"
          for m in $routable; do echo "      $m"; done
        else
          echo "(llama-server not answering — 'routable' and 'live' unavailable)"
        fi
        echo

        for repo in "$CACHE"/models--*; do
          [ -d "$repo" ] || continue
          echo "$(basename "$repo")  [$(du -sh "$repo" | cut -f1)]"
          find "$repo/snapshots" -name '*.gguf' 2>/dev/null | sort | while read -r f; do
            mark="   "
            case " $live " in *" $(readlink -f "$f") "*) mark=" * " ;; esac
            printf '%s%-52s %s\n' "$mark" "$(basename "$f")" \
              "$(du -sh --dereference "$f" 2>/dev/null | cut -f1)"
          done
        done
        echo
        echo "* = has a child process (loaded, or asleep with its VRAM handed back)"
        EOF
      - echo -e "\x1B[32m[+] prune what isn't configured with 'task llm:models:prune HOST={{.HOST}}'\x1B[0m"

  models:fetch:
    desc: 'Pre-download every configured model on HOST (Darwin: local) by asking for one token each. Vars: HOST (default terra)'
    silent: true
    vars:
      HOST: '{{.HOST | default "terra"}}'
      TARGET_USER: '{{.TARGET_USER | default "ipreston"}}'
    cmds:
      # Nothing loads at service start (see modules/system/llama-cpp.nix),
      # so a model that isn't in the cache yet downloads inside whichever
      # request first names it — several GB, under a client timeout that
      # was not written for it. This does that first request deliberately,
      # one model at a time, with a timeout that expects a download.
      #
      # Cheapest possible request rather than a dedicated endpoint:
      # llama-server has no download-only mode, and asking for one token
      # is what forces the child to resolve, fetch and load the weights.
      - |
        set -euo pipefail
        platform=$(python3 scripts/llm-local.py --host "{{.HOST}}" platform)
        if [ "$platform" = darwin ]; then
          exec python3 scripts/llm-local.py --host "{{.HOST}}" fetch
        fi
        configured=$(nix eval --raw \
          ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.models" \
          --apply 'm: builtins.concatStringsSep " " m')
        port=$(nix eval --raw --apply toString \
          ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.port")
        key_file=$(nix eval --raw ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.apiKeyFile")
        echo -e "\x1B[32m[+] warming {{.HOST}} — this is slow only for models not yet cached\x1B[0m"
        ssh -oForwardAgent=yes {{.TARGET_USER}}@{{.HOST}} \
          "sudo bash -se -- $port $key_file $configured" <<'EOF'
        set -euo pipefail
        PORT=$1; ENV_FILE=$2; shift 2
        key=$(grep -oP 'LLAMA_API_KEY=\K[^,]*' "$ENV_FILE" 2>/dev/null || true)
        rc=0
        for m in "$@"; do
          printf '    %-52s ' "$m"
          # --models-max 1 means each of these evicts the previous one, so
          # this is sequential by construction, not by politeness.
          t=$(curl -s -o /dev/null -w '%{http_code} %{time_total}s' --max-time 3600 \
            -X POST "http://127.0.0.1:${PORT}/v1/chat/completions" \
            ${key:+-H "Authorization: Bearer ${key}"} \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}") || rc=1
          echo "$t"
          case "$t" in 200*) ;; *) rc=1 ;; esac
        done
        exit $rc
        EOF

  models:prune:
    desc: 'Remove cached GGUFs HOST is no longer configured to serve. Vars: HOST (default terra), APPLY=true to actually delete (default dry run)'
    silent: true
    vars:
      HOST: '{{.HOST | default "terra"}}'
      APPLY: '{{.APPLY | default "false"}}'
      TARGET_USER: '{{.TARGET_USER | default "ipreston"}}'
    cmds:
      - |
        set -euo pipefail
        platform=$(python3 scripts/llm-local.py --host "{{.HOST}}" platform)
        if [ "$platform" = darwin ]; then
          exec python3 scripts/llm-local.py --host "{{.HOST}}" prune --apply "{{.APPLY}}"
        fi
        if [ "{{.APPLY}}" = "true" ]; then
          echo -e "\x1B[31m[!] APPLY=true — deleting unconfigured models on {{.HOST}}\x1B[0m"
        else
          echo -e "\x1B[32m[+] dry run against {{.HOST}} (APPLY=true to delete)\x1B[0m"
        fi
        # The keep-set is the declared `myLlamaCpp.models`, not whatever
        # happens to be loaded: in router mode at most one of several
        # configured models is resident, so "loaded" would delete the
        # idle ones. The script cross-checks the list against the running
        # router's /v1/models and aborts if they disagree, so a
        # half-applied switch can't turn into a deletion.
        configured=$(nix eval --raw \
          ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.models" \
          --apply 'm: builtins.concatStringsSep " " m')
        port=$(nix eval --raw --apply toString \
          ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.port")
        cache_dir=$(nix eval --raw ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.cacheDirectory")
        key_file=$(nix eval --raw ".#nixosConfigurations.{{.HOST}}.config.myLlamaCpp.operator.apiKeyFile")
        ssh -oForwardAgent=yes {{.TARGET_USER}}@{{.HOST}} \
          "sudo bash -s -- $cache_dir $port $key_file {{.APPLY}} $configured" \
          < scripts/llm-prune-models.sh

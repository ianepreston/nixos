---
name: check
# Third-party actions are pinned to full commit SHAs, with the tag kept in a
# trailing comment for Renovate. A tag or branch is mutable: whoever owns the
# action repo can repoint it at new code that then executes here — on the
# self-hosted runner, with NIX_SECRETS_DEPLOY_KEY loaded into the agent — with
# no merge on our side. A SHA can't move, so an upstream change only reaches
# us through a Renovate PR, which renovate.json holds for `minimumReleaseAge`
# (7 days) and, for same-tag digest moves, keeps off the auto-merge path.
#
# The self-hosted `nixos` runner already has Nix, so the jobs below don't
# install it. nix-installer-action detected this and short-circuited
# ("Nix was already installed, using existing install") without ever applying
# its `extra-conf`, so dropping it changed nothing but removes a third-party
# action from every job that touches the deploy key or the runner's
# trusted-user nix daemon. Daemon settings come from the host config
# (modules/profiles/base.nix sets experimental-features). Only the
# ubuntu-latest `lint` job still installs Nix, where it is a real install.
#
# PRs only, no run on push to main. Branch protection requires the branch to
# be up to date with main (`strict`) and requires every job below, so the tree
# that lands on main is the one the PR run already built. A main run would
# rebuild only etc/activate/the toplevel, and it would hold the single
# self-hosted runner, queueing PR checks behind it. Note the PR run builds
# GitHub's test-merge commit, so its toplevel differs from the one a host
# evaluates from main (the config embeds the commit). Every heavy path is
# shared, and that's what hosts pull from hpp-1's cache
# (modules/system/nix-cache.nix).
on:
  pull_request:
# Cancel superseded runs on the same ref to avoid wasting minutes when
# pushing rapid follow-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flake-check:
    name: nix flake check
    # Self-hosted on hpp-1 — eval walks every NixOS config's drvPath,
    # which pulls every flake input. Warm /nix/store on hpp-1 makes
    # this seconds instead of minutes. Same fork-PR guard as the
    # build job: workflow YAML can be edited by fork PRs and would
    # otherwise run on our host.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    # Bounds a wedged job on the single self-hosted runner. This does
    # NOT cover the #736 stall shape -- jobs that never get picked up
    # sit `queued`, and GitHub's separate 24h queue limit governs those
    # (SystemdUnitFailed / GithubRunnerStuckActivating are what catch
    # that now). What it does replace is the 360m default, which is
    # long enough for a hung build to hold the one ephemeral runner for
    # most of a working day and stall every job behind it.
    # Observed 4-9m; 45 is ample headroom for a cold input fetch.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # nix-secrets is a private flake input fetched via git+ssh from
      # github.com/ianepreston/nix-secrets. Inside CI we use a deploy
      # key (read-only) registered on that repo to authenticate; the
      # ssh-agent loaded here is what nix's git fetcher picks up when
      # cloning the input.
      - name: Authorize nix-secrets clone
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      # system.autoUpgrade evaluates `github:ianepreston/nixos`, which is
      # read-only, so a flake.nix input ref that flake.lock doesn't match
      # is a hard eval failure on every host. This checkout is writable, so
      # without the flag nix re-locks in place with only a warning and every
      # job here goes green on a flake main can't evaluate — how #865
      # merged and froze auto-upgrade on both servers (#866).
      - name: Check flake.lock matches flake.nix
        run: bash ./scripts/flake-checks.sh lock
      # Evaluate NixOS, Darwin, and Home Manager configurations sequentially.
      # Parallel evaluation in `nix flake check --all-systems` raced on
      # addToStore for filtered input subpaths on this runner. Darwin and
      # Home Manager evaluation also use the private input (see #349).
      - name: Eval each configuration
        run: bash ./scripts/flake-checks.sh eval-configs
  build:
    name: build ${{ matrix.host }}
    # Self-hosted runner on hpp-1 shares its warm /nix/store with CI,
    # so unchanged closures rebuild in seconds. See #180 for the design.
    #
    # PR-from-fork guard: a fork PR can edit this workflow and run
    # arbitrary code on our host. Restrict the build job to PRs whose head
    # branch lives in this repo; the `event_name` clause only matters if a
    # non-PR trigger is ever added back. Fork PRs still get the `lint`
    # job (cloud runner, no host access, no deploy key).
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    # Bounds a wedged job on the single self-hosted runner. This does
    # NOT cover the #736 stall shape -- jobs that never get picked up
    # sit `queued`, and GitHub's separate 24h queue limit governs those
    # (SystemdUnitFailed / GithubRunnerStuckActivating are what catch
    # that now). What it does replace is the 360m default, which is
    # long enough for a hung build to hold the one ephemeral runner for
    # most of a working day and stall every job behind it.
    # Observed up to 20m on a nixpkgs bump that rebuilds broadly; 90
    # leaves room for a worse one without ever bounding a real build.
    timeout-minutes: 90
    strategy:
      # Surface every failing host on a single PR rather than bailing
      # on the first red.
      fail-fast: false
      matrix:
        # Every real-hardware host: hpp-1 exercises the full server
        # profile (server + server-apps); terra and luna exercise the
        # workstation profile; amos1 is the second prod server. Builds on
        # hpp-1 hit the warm store for everything except host-specific
        # hardware/wm bits — net: a few seconds-to-minutes cold, free
        # warm. (Test/VM/ISO targets stay excluded.)
        host: [hpp-1, terra, amos1, luna]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authorize nix-secrets clone
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      # --no-update-lock-file: build the flake as committed, not a silently
      # re-locked one (see "Check flake.lock matches flake.nix" above).
      - name: Build ${{ matrix.host }}
        run: |
          nix build \
            --no-update-lock-file \
            --print-build-logs \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
      # The coding-sandbox guest's platform bundles are not a host closure,
      # and several (claude-code, databricks-cli, unity-gateway) are never in
      # cache.nixos.org. Building them here leaves them in hpp-1's store, so
      # a NixOS workstation seeding a new sandbox VM substitutes them from
      # hpp-1 instead of building them (#1006). Once, on a workstation leg.
      - name: Build coding-sandbox guest packages
        if: matrix.host == 'terra'
        run: |
          nix build \
            --no-update-lock-file \
            --print-build-logs \
            ".#legacyPackages.x86_64-linux.coding-sandbox-guest-packages"
  checks:
    name: build Linux flake checks
    # Builds every x86_64-linux flake check except pre-commit, which the lint
    # job owns. Building a `runNixOSTest` derivation *runs* the test in a QEMU
    # VM and fails on any assertion failure. Neither flake-check (evals each
    # config's drvPath) nor build (builds each host's toplevel) touches
    # checks.*, so without this job those checks are never built or run. Other
    # systems expose checks too, but there are no runners for them.
    #
    # We build the check derivation directly rather than via
    # `nix flake check` to avoid the parallel evaluation race described
    # in flake-check above.
    #
    # Same fork-PR guard as build: the workflow YAML can be edited by
    # fork PRs, which would otherwise run arbitrary code on our host.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    # Bounds a wedged job on the single self-hosted runner. This does
    # NOT cover the #736 stall shape -- jobs that never get picked up
    # sit `queued`, and GitHub's separate 24h queue limit governs those
    # (SystemdUnitFailed / GithubRunnerStuckActivating are what catch
    # that now). What it does replace is the 360m default, which is
    # long enough for a hung build to hold the one ephemeral runner for
    # most of a working day and stall every job behind it.
    # VM tests boot real guests; 90 matches the build matrix above.
    timeout-minutes: 90
    needs: flake-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authorize nix-secrets clone
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      - name: Build flake checks
        run: bash ./scripts/flake-checks.sh build-checks --system x86_64-linux --exclude pre-commit
  lint:
    name: pre-commit hooks
    # Builds checks.x86_64-linux.pre-commit — the check the
    # git-hooks.flakeModule exposes (nixfmt, statix, deadnix,
    # ripsecrets, check-yaml/json, whitespace, the Python source checks
    # ruff/ruff-format/check-ast, and the shell checks shellcheck/shfmt;
    # see modules/flake/git-hooks.nix). Building the check derivation runs
    # every hook against the tree and fails on any lint/format
    # violation, so this is the CI gate that keeps regressions off main
    # (closes #349).
    #
    # Runs on ubuntu-latest with NO fork guard and NO nix-secrets deploy
    # key: the pre-commit check doesn't touch the private nix-secrets
    # input, so it carries no host-access or secret-exposure risk and can
    # safely cover fork PRs (unlike the self-hosted build/eval jobs).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            lazy-trees = false
            always-allow-substitutes = false
      - name: Run pre-commit hooks
        run: bash ./scripts/flake-checks.sh lint --system x86_64-linux

---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
set: [pipefail]
shopt: [globstar]

includes:
  bootstrap: ./taskfiles/bootstrap.yaml
  llm: ./taskfiles/llm.yaml
  maintenance: ./taskfiles/maintenance.yaml
  recovery: ./taskfiles/recovery.yaml
  secrets: ./taskfiles/secrets.yaml
  ssh: ./taskfiles/ssh.yaml
  thermal: ./taskfiles/thermal.yaml
  vm: ./taskfiles/vm.yaml

tasks:
  default:
    cmd: task --list
    silent: true
  fmt:
    desc: Format all Nix files
    cmds:
      - find . -name '*.nix' -not -path './result/*' -exec nixfmt {} +
  check:
    desc: Full pre-push check (nix + Python + shell lint/format + flake eval)
    # `nix flake check` builds the `checks.<system>.pre-commit` derivation,
    # which runs nixfmt/statix/deadnix, the Python (ruff + ruff-format +
    # check-ast) and shell (shellcheck + shfmt) source checks, and the
    # secret/YAML/whitespace hooks via git-hooks.nix — the single
    # source of truth for lint config (incl. the hardware-file excludes).
    # No separate fmt-check/lint tasks: those hand-rolled the same tooling
    # and drifted out of sync (see #239 follow-up — the statix/deadnix CLI
    # invocations didn't match the tools' actual flag semantics).
    cmds:
      - nix flake check --all-systems
  hashes:
    desc: Regenerate the fetch hashes Renovate can't maintain (pass -- --check to only report)
    # Same script CI runs on every renovate/** and automated/flake-update
    # branch (.github/workflows/renovate-hashes.yml). Run it by hand after
    # editing a pinned `rev`/`tag` yourself — a stale hash silently builds the
    # old source on any host whose store already has it (#625).
    # nix-secrets resolves from flake.lock, like CI. `LOCAL_SECRETS=true task
    # hashes` opts into the sibling ../nix-secrets checkout (#1042).
    vars:
      LOCAL_SECRETS: '{{if kindIs "invalid" .LOCAL_SECRETS}}false{{else}}{{.LOCAL_SECRETS}}{{end}}'
    cmd: |
      set -euo pipefail
      case {{.LOCAL_SECRETS | shellQuote}} in
        true) export REGEN_NIX_ARGS='--override-input nix-secrets path:../nix-secrets' ;;
        # an inherited REGEN_NIX_ARGS must not smuggle in an override
        false) unset REGEN_NIX_ARGS ;;
        *) echo "LOCAL_SECRETS must be true or false" >&2; exit 1 ;;
      esac
      ./scripts/regen-fetch-hashes.sh {{.CLI_ARGS}}
  build:
    desc: Build a specific host (default luna)
    vars:
      HOST: '{{.HOST | default "luna"}}'
    cmds:
      - nix build .#nixosConfigurations.{{.HOST}}.config.system.build.toplevel
  build-all:
    desc: Build all NixOS host configurations
    cmds:
      - nix build .#nixosConfigurations.luna.config.system.build.toplevel
      - nix build .#nixosConfigurations.terra.config.system.build.toplevel
      - nix build .#nixosConfigurations.hpp-1.config.system.build.toplevel
      - nix build .#nixosConfigurations.amos1.config.system.build.toplevel
  # All three activate through scripts/activate-nixos.sh, which builds, copies,
  # then asserts the target hostname, closure name and the closure's own
  # etc/hostname in the same process that runs switch-to-configuration (#1018).
  # Pass ACTION=boot|test|check to change the action (default switch; `check`
  # asserts identity and activates nothing). Host and action are passed as
  # explicit arguments rendered with shellQuote, never through `env:` (Task lets
  # an inherited environment variable of the same name override `env:`, which
  # could redirect a deploy), and the helper validates them again.
  #
  # nix-secrets resolves from flake.lock, the revision `task build` and CI use
  # (auto-upgrade reads the lock from the GitHub flake, which can differ from a
  # local checkout) (#1042). `LOCAL_SECRETS=true task deploy:<host>` opts into
  # the sibling checkout (--local-secrets) for unpublished secrets work; it is
  # validated true|false like taskfiles/bootstrap.yaml.
  rebuild:
    desc: Rebuild this NixOS host (refuses unless hostname matches the configuration)
    vars:
      LOCAL_SECRETS: '{{if kindIs "invalid" .LOCAL_SECRETS}}false{{else}}{{.LOCAL_SECRETS}}{{end}}'
    cmd: |
      set -euo pipefail
      secrets=()
      case {{.LOCAL_SECRETS | shellQuote}} in
        true) secrets=(--local-secrets) ;;
        false) ;;
        *) echo "LOCAL_SECRETS must be true or false" >&2; exit 1 ;;
      esac
      ./scripts/activate-nixos.sh --host "$(hostname)" ${secrets[@]+"${secrets[@]}"} --action {{.ACTION | default "switch" | shellQuote}}
  rebuild:*:
    desc: Rebuild a particular config on this machine, pass :[hostname] (refuses unless it equals this machine's hostname)
    vars:
      LOCAL_SECRETS: '{{if kindIs "invalid" .LOCAL_SECRETS}}false{{else}}{{.LOCAL_SECRETS}}{{end}}'
    cmd: |
      set -euo pipefail
      secrets=()
      case {{.LOCAL_SECRETS | shellQuote}} in
        true) secrets=(--local-secrets) ;;
        false) ;;
        *) echo "LOCAL_SECRETS must be true or false" >&2; exit 1 ;;
      esac
      ./scripts/activate-nixos.sh --host {{index .MATCH 0 | shellQuote}} ${secrets[@]+"${secrets[@]}"} --action {{.ACTION | default "switch" | shellQuote}}
  deploy:*:
    desc: Build locally, copy, and activate on a live remote host, pass :[hostname] for the target
    vars:
      LOCAL_SECRETS: '{{if kindIs "invalid" .LOCAL_SECRETS}}false{{else}}{{.LOCAL_SECRETS}}{{end}}'
    cmd: |
      set -euo pipefail
      secrets=()
      case {{.LOCAL_SECRETS | shellQuote}} in
        true) secrets=(--local-secrets) ;;
        false) ;;
        *) echo "LOCAL_SECRETS must be true or false" >&2; exit 1 ;;
      esac
      ./scripts/activate-nixos.sh --host {{index .MATCH 0 | shellQuote}} --dest {{index .MATCH 0 | shellQuote}} ${secrets[@]+"${secrets[@]}"} --action {{.ACTION | default "switch" | shellQuote}}
  build_home:*:
    desc: Rebuild standalone home-manager, pass :[flaketarget] for the target
    cmd: nix shell nixpkgs#home-manager -c home-manager -b bak switch --flake .#{{ index .MATCH 0 }}
  build_darwin:*:
    desc: Rebuild nix-darwin, pass :[flaketarget] for the target
    cmd: sudo darwin-rebuild switch --flake .#{{ index .MATCH 0 }}
  valheim:joincode:
    desc: Print the current Valheim crossplay join code (crossplay hosts only; default HOST=amos1)
    # PlayFab issues a fresh 6-digit code on every server start, so this
    # has to be re-read (and re-shared with players) after any restart of
    # podman-valheim.service. The code is only in the server's stdout.
    #
    # Only meaningful on a host with `myValheim.crossplay = true` (both
    # amos1 and hpp-1 today). A Steam-backend server gets no join code at
    # all — players join it by address — so the failure message below is
    # the expected output there, not a bug.
    vars:
      HOST: '{{.HOST | default "amos1"}}'
    cmd: |
      set -euo pipefail
      ssh ipreston@{{.HOST}} 'sudo podman logs valheim 2>&1' \
        | grep -oiE 'join code [0-9]+' | tail -1 \
        || { echo "No join code in the log — is CROSSPLAY=true and has the server finished starting?" >&2; exit 1; }
  update:
    desc: patch the flake
    cmd: nix flake update
  update_dconf:
    desc: Grab dconf config and pull it into your files, remember to select the key
    cmd: ./scripts/dconf.sh
  garbage_collect:
    desc: remove unreachable store objects and any generations older than a week
    cmd: nix-collect-garbage --delete-older-than 7d
  iso:
    desc: Build the installer/recovery ISO
    cmd: |
      # If we dont remove this folder, libvirtd VM doesnt run with the new iso...
      rm -rf result
      nix build --impure .#nixosConfigurations.iso.config.system.build.isoImage && ln -sf result/iso/*.iso latest.iso
